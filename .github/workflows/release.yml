name: Release

# Releases are built on demand only. A tag push is not enough on purpose: the
# release APK must be cut from a commit where CI is green, not from whatever
# happened to be tagged.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.3.0); leave empty to only build the APK'
        required: false
        type: string
      create_release:
        description: 'Create a GitHub Release and attach the APK to it'
        required: false
        type: boolean
        default: true

# One release at a time; re-running a dispatch cancels nothing mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Android
        uses: ./.github/actions/setup-android
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      # Signing secrets are per-repository: a fork does not inherit them. Without
      # them the build still produces an unsigned APK, but publishing that as a
      # release would be worse than stopping — hence the explicit refusal below.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
            cat > keystore.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "has_keystore=true" >> "$GITHUB_ENV"
            echo "Release build will be signed."
          else
            echo "has_keystore=false" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_BASE64 secret is not set — building an UNSIGNED release APK. See RELEASE.md for the required secrets."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Refuse to publish an unsigned release
        if: ${{ inputs.create_release && inputs.tag != '' && env.has_keystore != 'true' }}
        run: |
          echo "::error::Refusing to create a GitHub Release from an UNSIGNED APK. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets (see RELEASE.md), then re-run this workflow."
          exit 1

      - name: Check release metadata is in sync
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            python3 scripts/check_release_metadata.py
          fi

      - name: Read version name
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Memosly-v${{ steps.version.outputs.name }}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: ${{ inputs.create_release && inputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Memosly ${{ inputs.tag }}
          files: dist/*.apk
          generate_release_notes: false
          body: |
            ## 安装方式

            1. 下载下方的 `Memosly-v*-release.apk`
            2. 在 Android 设备上允许"安装未知来源应用"
            3. 打开 APK 文件安装

            ## Installation

            1. Download `Memosly-v*-release.apk` below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK to install
